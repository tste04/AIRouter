name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & Test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -v -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test -v -Xswiftc -warnings-as-errors

  build-ios:
    name: Build (iOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS
        run: >
          xcodebuild -scheme AIRouter
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO build
